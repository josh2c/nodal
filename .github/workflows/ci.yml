name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  schemas:
    name: schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: schemas/ is what the model generates
        run: ci/schema-diff.sh

  acceptance-recipe:
    name: acceptance (recipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the fixture project infers with zero gaps
        run: ci/acceptance-recipe.sh

  acceptance-output:
    name: acceptance (output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: both renderers match their snapshots
        run: ci/acceptance-output.sh

  acceptance-env:
    name: acceptance (env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: direnv, so the .envrc route is exercised and not skipped
        run: sudo apt-get update && sudo apt-get install -y direnv
      - name: an activated home carries its variables and leaks no value
        run: ci/acceptance-env.sh

  acceptance-entry:
    name: acceptance (entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the shells the integration is written for, and direnv for the other route
        run: sudo apt-get update && sudo apt-get install -y zsh fish direnv
      - name: a process in an activated home carries NODAL_ID, and no shell is started
        run: ci/acceptance-entry.sh

  acceptance-attribution:
    name: acceptance (attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the daemon the docker signal reads, which the runner already has
        run: docker info --format '{{.ServerVersion}}'
      - name: what is running is attributed to its unit, with a confidence per row
        run: ci/acceptance-attribution.sh

  acceptance-operation:
    name: acceptance (operation)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: a killed operation is reported and rolled back by the next invocation
        run: ci/acceptance-operation.sh

  acceptance-new:
    name: acceptance (new)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: a unit is clean and alone, and a killed create leaves nothing
        run: ci/acceptance-new.sh

  acceptance-ports:
    name: acceptance (ports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: two units get distinct ports and a pinned port names its holder
        run: ci/acceptance-ports.sh

  acceptance-materialize:
    name: acceptance (materialize)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: a home holds the project, leaves out what the list names, and is made fast
        run: ci/acceptance-materialize.sh

  acceptance-substrate:
    name: acceptance (substrate)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: two bases coexist, a pinned base is refused, a neighbour build is faster
        run: ci/acceptance-substrate.sh

  acceptance-fixture:
    name: acceptance (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.11.0 }
      - name: the fixture infers with zero gaps and builds inside its budget
        run: ci/acceptance-fixture.sh

  startup:
    name: startup budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the release binary starts inside the startup budget
        run: ci/startup-budget.sh

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  release:
    name: release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p nodal-cli
      - uses: actions/upload-artifact@v4
        with:
          name: nodal-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nodal
          if-no-files-found: error

  acceptance:
    name: acceptance (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nodal-${{ matrix.target }}
          path: artifact
      - run: chmod +x artifact/nodal
      - name: nodal --version from the release artifact
        run: ci/acceptance-version.sh artifact/nodal

# Returning with the task that creates what it checks: safety suite (tests/safety).
