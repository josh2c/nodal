[workspace]
resolver = "3"
members = ["crates/nodal-core", "crates/nodal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/josh2c/nodal"

[workspace.dependencies]
nodal-core = { path = "crates/nodal-core", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
# Two calls, both about the process that is running an operation: the host name that
# goes in the journal, and the signal-zero check for whether an interrupted run's
# process is really gone. Already in the tree under SQLite; no new licence.
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# nodal.toml and the project config files inference reads. Parsing only; the recipe is
# rendered by `recipe::render` so gap comments can sit next to the keys they belong to.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# The registry. `bundled` compiles SQLite into the binary, so behaviour does not depend
# on which version a machine happens to ship and WAL is always available.
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
# The fingerprint digest. One hash, pure Rust, no build script.
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "parsing",
  "serde",
  "std",
] }
ulid = { version = "1", default-features = false, features = ["std"] }
# Test-only: the differential check that a scalar's validator and its exported schema
# pattern agree. Lookahead, which `regex` does not have, is needed for branch names.
fancy-regex = "0.16"
# Test-only: temporary repositories and directories for the Git facade tests.
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }

# Complexity is a linter setting, not a review opinion (docs/code-structure.md).
# Thresholds live in clippy.toml; the levels below are hard limits in CI and locally.
[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = "symbols"
