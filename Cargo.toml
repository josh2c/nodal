[workspace]
resolver = "3"
members = [
  "crates/nodal-core",
  "crates/nodal-cli",
  "benches/startup",
  "tests/fixture",
  "tests/safety",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/josh2c/nodal"

[workspace.dependencies]
nodal-core = { path = "crates/nodal-core", version = "0.1.0" }
# Test-only: the project CI runs Nodal against, so CI never needs a real one.
nodal-fixture = { path = "tests/fixture" }
# Test-only: the test kit every suite runs on, and the safety suite built on it. The
# two crates that depend on it are the two it depends on, so the edge back is a
# dev-dependency and Cargo resolves the loop.
nodal-safety = { path = "tests/safety" }
clap = { version = "4", features = ["derive", "env"] }
# Two calls, both about the process that is running an operation: the host name that
# goes in the journal, and the signal-zero check for whether an interrupted run's
# process is really gone. Already in the tree under SQLite; no new licence.
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# nodal.toml and the project config files inference reads. Parsing only; the recipe is
# rendered by `recipe::render` so gap comments can sit next to the keys they belong to.
toml = { version = "0.9", default-features = false, features = [
  "display",
  "parse",
  "serde",
] }
# The registry. `bundled` compiles SQLite into the binary, so behaviour does not depend
# on which version a machine happens to ship and WAL is always available.
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
# The fingerprint digest. One hash, pure Rust, no build script.
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "parsing",
  "serde",
  "std",
] }
ulid = { version = "1", default-features = false, features = ["std"] }
# Test-only: the differential check that a scalar's validator and its exported schema
# pattern agree. Lookahead, which `regex` does not have, is needed for branch names.
fancy-regex = "0.16"
# Test-only: temporary repositories and directories for the Git facade tests.
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }

# Complexity is a linter setting, not a review opinion (docs/code-structure.md).
# Thresholds live in clippy.toml; the levels below are hard limits in CI and locally.
[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
# A suppression states the technical reason it is correct, so a reader knows whether the
# reason still holds and a later change can remove the allow when it does not.
allow_attributes_without_reason = "deny"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

# The bundled SQLite is about a quarter of the release artifact, and it is the one
# dependency whose speed nothing waits for: the registry holds one row for each unit, and
# every statement it runs is a point lookup or a short scan over tens of rows. Compiled
# for size it costs 887,968 fewer bytes on the CI runner and measures the same.
#
# The stanza is here and not in `.cargo/config.toml`, because `cargo install --git` reads
# this manifest and does not read that file. The artifact a person installs must be the
# artifact CI measures.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
